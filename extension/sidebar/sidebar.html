<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WatchSync Sidebar</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div id="toggle-btn" class="toggle-btn">‹</div>
  
  <div class="sidebar-container" id="sidebar">
    <div class="header">
      <h2>WatchSync</h2>
      <button id="btn-video" class="btn-icon" title="Start Video Call">📹</button>
    </div>

    <div class="participants-panel">
      <div class="panel-header" id="participants-toggle">
        <span>Participants (<span id="p-count">1</span>)</span>
        <span class="chevron">▼</span>
      </div>
      <div class="panel-content" id="participants-list">
        <!-- Participants injected here -->
      </div>
    </div>

    <div class="chat-section">
      <div id="chat-messages" class="chat-messages">
        <!-- Messages injected here -->
      </div>
      
      <div class="reaction-bar">
        <button class="reaction-btn">👍</button>
        <button class="reaction-btn">😂</button>
        <button class="reaction-btn">😮</button>
        <button class="reaction-btn">😢</button>
        <button class="reaction-btn">🔥</button>
        <button class="reaction-btn">❤️</button>
      </div>
      
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="Type a message...">
        <button id="btn-send">Send</button>
      </div>
    </div>
  </div>

  <div id="video-panel" class="video-panel hidden">
    <div class="video-header">
      <span>Video Call</span>
      <button id="btn-close-video" class="btn-icon small">✖</button>
    </div>
    <div id="video-grid" class="video-grid">
      <!-- Video tiles injected here -->
      <div class="video-tile local-tile">
        <video id="local-video" autoplay muted playsinline></video>
        <div class="controls">
          <button id="btn-mute" class="btn-icon small">🎤</button>
          <button id="btn-cam" class="btn-icon small">📷</button>
        </div>
      </div>
    </div>
  </div>

  <div id="floating-emojis"></div>

  <script src="sidebar.js"></script>
</body>
</html>
